<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元素混战 · 双人对战</title>
<style>
:root{
  --bg:#14161c; --panel:#1d2028; --panel2:#232733; --line:#2c3140;
  --text:#e8eaf0; --muted:#8b91a3; --brand:#4f7cff; --danger:#e0533d;
  --good:#43b581; --warn:#e0a83d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
#app{max-width:1080px;margin:0 auto;padding:16px 14px 60px;}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:9px 16px;
  font-size:14px;cursor:pointer}
.btn:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.col{flex:1;min-width:320px}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .tag{font-size:11px;color:var(--muted);font-weight:400}
input.name{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 10px;font-size:13px;width:100%}
.group-title{font-size:12px;color:var(--muted);margin:10px 0 5px;display:flex;gap:6px;align-items:center}
.group-title b{color:var(--text);font-weight:600}
.rostergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.charcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;
  cursor:pointer;font-size:12px;line-height:1.35;transition:border-color .12s, background .12s}
.charcard:hover{border-color:var(--brand)}
.charcard.sel{border-color:var(--brand);background:rgba(79,124,255,.14)}
.charcard .cn{font-weight:600}
.charcard .cmeta{color:var(--muted);font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.counter{font-size:12px;color:var(--muted);margin-top:6px}
.counter.ok{color:var(--good)}
.detail{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;font-size:13px}
.detail h3{margin:0 0 6px;font-size:15px}
.dmeta{color:var(--muted);font-size:12px;margin-bottom:6px}
.dpas{font-size:12px;color:var(--warn);margin-bottom:8px}
.dsk .sk{border-top:1px dashed var(--line);padding:6px 0}
.dsk .sk b{margin-right:6px}
.dsk .cost{color:var(--brand);font-size:11px}
.dsk .skd{color:var(--muted);font-size:12px;margin-top:2px}
.envrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.envbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:6px 12px;font-size:12px;cursor:pointer}
.envbtn.sel{border-color:var(--brand);background:rgba(79,124,255,.14)}
/* 战斗 */
.battle-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.battle-top .phase{font-weight:700;font-size:15px}
.side-label{font-size:12px;color:var(--muted);margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.unit{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;position:relative;font-size:12px}
.unit.dead{opacity:.42}
.unit.pickable{cursor:pointer;border-color:var(--brand)}
.unit.picked{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.unit .nm{font-weight:600;display:flex;align-items:center;gap:5px}
.unit .hp{color:var(--muted);font-size:11px;margin-left:auto}
.unit .qi{color:var(--brand);font-size:11px}
.hpbar{height:4px;border-radius:2px;background:var(--panel);overflow:hidden;margin:4px 0}
.hpbar>i{display:block;height:100%}
.chips{color:var(--muted);font-size:10.5px;min-height:13px;line-height:1.3}
.skillpanel{margin-top:10px}
.unit-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.unit-row .uname{width:70px;font-weight:600;font-size:13px;flex-shrink:0}
.skbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;
  padding:4px 8px;font-size:12px;cursor:pointer;margin:2px 2px 0 0}
.skbtn:hover:not(:disabled){border-color:var(--brand)}
.skbtn:disabled{opacity:.4;cursor:not-allowed}
.skbtn.cost{color:var(--brand)}
.pick-hint{color:var(--brand);font-size:12px;margin:8px 0}
.queuebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.qitem{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:14px;
  font-size:12px;color:var(--muted);max-height:180px;overflow-y:auto;white-space:pre-wrap}
.log b{color:var(--text)}
.err{color:var(--danger);font-size:12px;margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 34px;text-align:center;max-width:420px}
.overlay h2{margin:0 0 10px}
.overlay p{color:var(--muted);font-size:13px;margin:0 0 18px}
.big{padding:12px 26px;font-size:16px}
.form-badge{display:inline-block;font-size:10px;color:#ffd76b;background:rgba(224,192,74,.14);border:1px solid rgba(224,192,74,.4);border-radius:6px;padding:0 5px;margin-left:4px;line-height:1.5;vertical-align:middle}
.form-title{font-size:12px;color:#ffd76b;font-weight:600;margin:8px 0 4px;border-top:1px dashed var(--line);padding-top:8px}
.battle-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
.battle-main{display:grid;gap:0}
.battle-log{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--muted);white-space:pre-wrap}
.battle-log b{color:var(--text)}
@media (max-width:860px){.battle-wrap{grid-template-columns:1fr}.battle-log{position:static;max-height:240px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// 元素混战 · MVP 引擎 v0.1
// 纯逻辑、零依赖。范围：4v4、气势、部位掷骰、四元素异常（火/冰/雷/毒）、
// 潮湿与蒸发/导电/冻结、护盾/无敌/减伤、胜负判定。
// 未实现（明确砍掉）：武器与耐久、元素共鸣、背水一战、控制条例19章、土/金/木/暗。

const ENGINE_VERSION = '0.1.0';

/* ---------------- 随机 ---------------- */
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const PART_MULT = { vital: 1.6, body: 1.0, armor: 0.7 };

/* ---------------- 元素异常 ---------------- */
const ABNORMAL = {
  火: { name: '灼烧', th: 12, turns: 2, dot: 5 },
  冰: { name: '冰冻', th: 12, turns: 1, dot: 0 },
  雷: { name: '雷罚', th: 15, turns: 2, dot: 0 },
  毒: { name: '中毒', th: 12, turns: 3, dot: 3 },
  木: { name: '缠绕', th: 10, turns: 3, dot: 3 },
  金: { name: '锈蚀', th: 12, turns: 2, dot: 0 },
  光: { name: '辉耀', th: 12, turns: 1, dot: 0 },
  暗: { name: '诅咒', th: 12, turns: 1, dot: 0 },
  土: { name: '重压', th: 12, turns: 2, dot: 0 },
};
const ELEMENTAL_STATUS = Object.values(ABNORMAL).map((a) => a.name);

// 各元素抗性：applyToMe 元素获取衰减；dmgTaken 受到该元素伤害的增减
const RESIST = {
  火: { applyToMe: { 毒: 0.5 }, burnDot: 0.5 },
  水: { applyToMe: { 火: 0.5 }, burnTurns: 1 },
  风: {},
  冰: { applyToMe: { 雷: 0.5 } },
  雷: {},
  毒: {},
  土: { applyToMe: { 毒: 0.5 }, dmgTaken: { 风: -0.2 } },
  光: { dmgTaken: { 暗: -0.2 } },
  暗: { dmgTaken: { 光: -0.2 }, applyToMe: { 火: 0.5 } },
  金: { dmgTaken: { 木: -0.25 } },
  木: { dmgTaken: { 金: -0.25 }, applyToMe: { 毒: 0.5 } },
  无: {},
};

// 规则书没有武器表，只给了耐久规则；这里按定位分配初始耐久（见 docs/裁决清单.md D1）
const WEAPON_DUR_BY_ROLE = { 坦克: 16, 战士: 12, 刺客: 10, 射手: 10, 法师: 8, 辅助: 8, 治疗: 8 };
const WEAPON_WAKE_DMG = 4;

// 用户补充的武器表：角色 → 武器名
const WEAPON_BY_CHAR = {
  赤潮: '偃月刀', 灰蛰: '爆炎双刃', 焚炎: '焚天法杖', 炎龙: '龙煌战戟',
  澜汐: '澜水法珠', 汐: '潮汐权杖', 英波: '鳞波枪',
  乌川: '挽风双刃', 朔飔: '朔风法杖', 凌风: '裂风短刃',
  皓霜: '霜袖法杖', 玄渊: '寒渊双刃', 寒魄: '永冻巨锤',
  金岚: '浮光法杖', 黯雷: '奔霄短刃', 霆光: '霆光长弓', 闪霆: '掌雷指环',
  藕苞: '虫蛊法珠', 蛊蔓: '蛊蔓藤杖', 蚀骸: '蚀骸骨刃',
  磐岩: '磐岩巨盾', 沉壤: '沉壤战锤', 岩铠: '岩铠重盾',
  晨晖: '晨晖圣杖', 曙星: '曙星法珠', 流光: '流光圣剑',
  冥影: '冥影短刃', 夜煞: '夜煞法杖', 影刃: '影刃双刺',
  铮锋: '铮锋长剑', 铁骨: '铁骨重盾', 铁心: '铁心巨斧',
  青藤: '青藤法杖', 苍柏: '苍柏战刃', 灵木: '灵木枝杖',
  碧尘: '撼地重锤', 青穹: '不坏重盾', 殷红: '殷红巨刃', 沧嵐: '沉岳重戟',
};

const WEAPONS = {};
function registerWeapons(list) {
  for (const w of list || []) WEAPONS[w.name] = w;
  return Object.keys(WEAPONS).length;
}
const wdef = (u) => (u.weapon && WEAPONS[u.weapon.name]) || null;

// 元素共鸣（第十二章）。req 为元素需求：长度 2 = 该系 ≥2 人；长度 3 = 三系各 ≥1。
// mods 里每个键都由引擎在对应结算点读取。
const RESONANCES = [
  { id: '焚天', req: ['火', '火'], desc: '灼烧每跳+1、火伤+10%、冰冻-1回合', mods: { burnDotAdd: 1, fireDmg: 0.1, freezeTurnsAdd: -1 } },
  { id: '永冻', req: ['冰', '冰'], desc: '冰冻+1回合、冰值+1、每回合回3血', mods: { freezeTurnsAdd: 1, iceValAdd: 1, healPerRound: 3 } },
  { id: '天雷', req: ['雷', '雷'], desc: '雷罚+8%、敌方每回合 1 点气势流失', mods: { enemyQiDrain: 1 } },
  { id: '瘟疫', req: ['毒', '毒'], desc: '中毒每跳+1、治疗-15%', mods: { poisonDotAdd: 1, healMult: 0.85 } },
  { id: '裂空', req: ['风', '风'], desc: '每回合驱散自身 1 个减益', mods: { purgePerRound: 1 } },
  { id: '洪流', req: ['水', '水'], desc: '水伤+10%、每回合回2血', mods: { waterDmg: 0.1, healPerRound: 2 } },
  { id: '归一', req: ['无', '无'], desc: '无属性伤害+15%、受到伤害-8%', mods: { wuDmg: 0.15, dmgTakenMult: 0.92 } },
  { id: '地脉', req: ['土', '土'], desc: '每回合自动+1岩印、土伤+10%', mods: { markAuto: '岩印', earthDmg: 0.1 } },
  { id: '圣光', req: ['光', '光'], desc: '每回合自动+1辉光', mods: { markAuto: '辉光' } },
  { id: '暗影', req: ['暗', '暗'], desc: '每回合自动+1咒印、诅咒伤+15%', mods: { markAuto: '咒印', curseDmg: 0.15 } },
  { id: '锋刃', req: ['金', '金'], desc: '每回合自动+1锋锐印、护甲部位伤+20%', mods: { markAuto: '锋锐印', armorDmg: 0.2 } },
  { id: '长青', req: ['木', '木'], desc: '每回合自动+1生息印、治疗+15%', mods: { markAuto: '生息印', healMult: 1.15 } },
  { id: '混沌', req: ['火', '冰', '雷'], desc: '每次技能命中随机附加 1 点火/冰/雷值', mods: { randomElement: true } },
  { id: '腐沼', req: ['毒', '风', '水'], desc: '中毒可扩散（记日志）', mods: {} },
  { id: '天火', req: ['火', '雷', '风'], desc: '异常可共存 3 种、全队每回合 +1 气势', mods: { maxStatus: 3, qiPerRound: 1 } },
  { id: '煌天', req: ['火', '光', '雷'], desc: '异常可共存 3 种、全队每回合 +1 气势', mods: { maxStatus: 3, qiPerRound: 1 } },
  { id: '幽冥', req: ['暗', '毒', '冰'], desc: '异常可共存 3 种、敌方每回合 -1 气势', mods: { maxStatus: 3, enemyQiDrain: 1 } },
  { id: '万象', req: ['土', '光', '暗'], desc: '全队受伤 -8%', mods: { dmgTakenMult: 0.92 } },
  { id: '百炼', req: ['火', '金', '土'], desc: '全队武器耐久损耗 -30%', mods: { weaponWearMult: 0.7 } },
  { id: '森罗', req: ['木', '水', '毒'], desc: '中毒潮湿 +1 回合（记日志）', mods: {} },
  { id: '金石', req: ['金', '土', '光'], desc: '护盾吸收 +30%', mods: { shieldMult: 1.3 } },
  { id: '枯荣', req: ['木', '火', '暗'], desc: '异常可共存 3 种、敌方每回合 -1 气势、全队回2血', mods: { maxStatus: 3, enemyQiDrain: 1, healPerRound: 2 } },
];

const HARD_CC = ['冰冻', '麻痹', '封印'];

function detectResonances(team) {
  const count = {};
  for (const name of team) {
    const c = CHARS[name];
    if (!c) continue;
    count[c.element] = (count[c.element] || 0) + 1;
  }
  const out = [];
  for (const r of RESONANCES) {
    if (r.req.length === 2) {
      if ((count[r.req[0]] || 0) >= 2) out.push(r.id);
    } else if (r.req.every((e) => (count[e] || 0) >= 1)) {
      out.push(r.id);
    }
  }
  return out;
}

// 五大战场环境（第七章）。mods 的键由引擎在各结算点读取。
const ENVIRONMENTS = [
  { id: 'lava', name: '熔岩荒原', mods: { burnDot: 1, heal: 0.75, poisonGain: 0.5, waterSelfDot: 2, waterDmg: 0.15, fireValExtra: 1, fireDmg: 0.1, weaponWear3: true } },
  { id: 'wetland', name: '泽国湿地', mods: { wetAll: 2, poisonPerRound: 1, waterDmg: 0.15, fireValMinus: 2 } },
  { id: 'canyon', name: '雷云峡谷', mods: { wetThunder: 2, thunderUlt: 2, lightGain: 0.5, weaponWear3: true } },
  { id: 'pillar', name: '狂风隘口', mods: { poisonPerRound: -2, singleMiss: 0.15, darkGain: 1 } },
  { id: 'icefield', name: '永冻冰原', mods: { dotAll: 2, qiMinus: 1, fireValHalf: true, iceValExtra: 1, weaponWear3: true } },
];

function weaponStage(u) {
  const w = u.weapon;
  if (!w || w.dur <= 0) return 'broken';
  if (w.dur >= w.max * 0.5) return 'intact';
  if (w.dur >= 4) return 'cracked';
  return 'fragile';
}

/* ---------------- 角色档案 ---------------- */
const C = (o) => ({
  name: o.name,
  element: o.element,
  maxHp: o.hp,
  role: o.role,
  parts: { vital: o.v[0], body: o.v[1], armor: 100 - o.v[0] - o.v[1] },
  sp: { init: o.sp[0], max: o.sp[1], min: o.sp[2] },
  passive: o.passive || '',
  skills: o.skills.map((s, i) => ({ id: i + 1, ...s })),
});

const CHARS = {
  焚炎: C({
    name: '焚炎', element: '火', hp: 135, v: [18, 42], role: '法师', sp: [1, 4, -4],
    passive: '造成灼烧时额外+1火值',
    skills: [
      { name: '火球', cost: 0, target: 'one', desc: '单体11伤 +2火值', use: (B, me, [t]) => B.hit(me, t, { dmg: 11, ele: ['火', 2] }) },
      { name: '烈焰冲击', cost: 3, target: 'one', desc: '单体17伤 +3火值', use: (B, me, [t]) => B.hit(me, t, { dmg: 17, ele: ['火', 3] }) },
      { name: '焚风', cost: 4, target: 'two', desc: '两名各13伤 +2火值', use: (B, me, ts) => ts.forEach((t) => B.hit(me, t, { dmg: 13, ele: ['火', 2] })) },
      { name: '灼热之环', cost: 5, target: 'all', desc: '全体9伤 +2火值，已灼烧+25%', use: (B, me, ts) => ts.forEach((t) => B.hit(me, t, { dmg: 9, mult: B.hasStatus(t, '灼烧') ? 1.25 : 1, ele: ['火', 2] })) },
      { name: '炼狱爆裂', cost: 8, target: 'one', desc: '30伤 +相邻12溅射，灼烧2回合', use: (B, me, [t]) => { B.hit(me, t, { dmg: 30, ele: ['火', 3] }); B.splash(me, t, 12); B.addStatus(t, '灼烧', 2); } },
    ],
  }),

  澜汐: C({
    name: '澜汐', element: '水', hp: 135, v: [15, 38], role: '辅助', sp: [0, 3, -5],
    passive: '火值叠加减半；灼烧仅1回合。命中灼烧目标清空火值',
    skills: [
      { name: '水弹', cost: 0, target: 'one', desc: '单体10伤 +潮湿', use: (B, me, [t]) => { B.hit(me, t, { dmg: 10 }); B.addWet(t, 1); } },
      { name: '漫雨', cost: 4, target: 'all', desc: '全体7伤', use: (B, me, ts) => ts.forEach((t) => B.hit(me, t, { dmg: 7 })) },
      { name: '凝水护盾', cost: 3, target: 'ally1', desc: '己方单体减伤50%·1回合，清灼烧/中毒', use: (B, me, [t]) => { B.reduce(t, 0.5, 1); B.clearStatus(t, '灼烧'); B.clearStatus(t, '中毒'); } },
      { name: '激流冲击', cost: 5, target: 'one', desc: '24伤；潮湿目标五成麻痹', use: (B, me, [t]) => { B.hit(me, t, { dmg: 24 }); if (t.wet > 0 && B.rnd() < 0.5) B.addStatus(t, '麻痹', 1); } },
      { name: '洪涛湮灭', cost: 7, target: 'all', desc: '全体18伤，清全场火值与灼烧', use: (B, me, ts) => { ts.forEach((t) => B.hit(me, t, { dmg: 18 })); B.clearAllFire(); } },
    ],

/** 把 data/*.js 里的角色登记进引擎（可多次调用） */
function registerChars(list) {
  for (const c of list || []) {
    if (!c || !c.name) continue;
    CHARS[c.name] = {
      name: c.name,
      element: c.element,
      maxHp: c.hp,
      role: c.role,
      passive: c.passive || '',
      parts: { vital: c.vital, body: c.body, armor: 100 - c.vital - c.body },
      sp: { init: c.spirit[0], max: c.spirit[1], min: c.spirit[2] },
      skills: c.skills.map((s, i) => ({ id: i + 1, ...s, form: s.form || (SKILL_FORM[c.name] && SKILL_FORM[c.name][s.name]) || '常态' })),
    };
  }
  return roster();
}

/* ---------------- 对局 ---------------- */
function mkUnit(def, key, sideKey) {
  return {
    key,
    side: sideKey,
    name: def.name,
    element: def.element,
    role: def.role,
    maxHp: def.maxHp,
    hp: def.maxHp,
    parts: def.parts,
    spirit: def.sp.init,
    spiritMax: def.sp.max,
    spiritMin: def.sp.min,
    qi: 0,
    alive: true,
    frozen: false,
    acted: false,
    actsUsed: 0,
    zeroUsed: false,
    wet: 0,
    hurtThisRound: false,
    dmgTaken: 0,
    invuln: 0,
    reduce: null,
    shield: null,
    buffs: [],
    debuffs: [],
    st: [],
    vals: { 火: 0, 冰: 0, 雷: 0, 毒: 0, 木: 0, 金: 0, 光: 0, 暗: 0, 土: 0 },
    marks: {},
    weapon: (() => {
      const w = WEAPONS[WEAPON_BY_CHAR[def.name]];
      const max = w ? w.dur : WEAPON_DUR_BY_ROLE[def.role] || 10;
      return { name: w ? w.name : '通用武器', max, dur: max, broken: false };
    })(),
    form: '常态',
    ccDone: 0,
    ccResist: 0,
    ccWindow: 0,
    frozenRounds: 0,
    poisonBoost: false,
    freeChongshan: false,
  };
}

function mkSide(label, team, sideKey) {
  return {
    label,
    units: team.map((ch, i) => {
      const def = CHARS[ch];
      if (!def) throw new Error(`未知角色：${ch}`);
      return mkUnit(def, `${sideKey}-${i + 1}`, sideKey);
    }),
  };
}

function createBattle({ playerTeam, enemyTeam, seed = Date.now() >>> 0, first, env, reso } = {}) {
  if (playerTeam.length !== 4) throw new Error('我方必须选 4 名角色');
  if (enemyTeam.length !== 4) throw new Error('敌方必须 4 名角色');
  const dup = new Set([...playerTeam, ...enemyTeam]);
  if (dup.size !== 8) throw new Error('同一角色不能重复出场');

  const B = { seed, rnd: makeRng(seed), round: 0, x: 1, phase: null, over: null, log: [], winnerNote: '' };
  B.sides = { player: mkSide('你', playerTeam, 'player'), enemy: mkSide('我', enemyTeam, 'enemy') };
  B.first = first || (B.rnd() < 0.5 ? 'player' : 'enemy');
  B.env = env ? ENVIRONMENTS.find((e) => e.id === env) || ENVIRONMENTS[0] : ENVIRONMENTS[Math.floor(B.rnd() * ENVIRONMENTS.length)];
  B.mods = () => (B.env && B.env.mods) || {};
  // 元素共鸣：编队确定后自动检测候选，玩家可指定 1 种，否则取候选第一个
  B.resoCandidates = { player: detectResonances(playerTeam), enemy: detectResonances(enemyTeam) };
  B.reso = {
    player: reso && B.resoCandidates.player.includes(reso) ? reso : B.resoCandidates.player[0] || null,
    enemy: B.resoCandidates.enemy[0] || null,
  };
  B.rmods = (side) => {
    const id = B.reso[side];
    const r = id ? RESONANCES.find((x) => x.id === id) : null;
    return (r && r.mods) || {};
  };
  B.over = null;
  B.backwater = null;

  /* 背水一战（第十八章）：每大回合开始独立判定，全局只触发 1 次 */
  B.checkBackwater = () => {
    if (B.backwater || B.round < 5) return;
    for (const s of ['player', 'enemy']) {
      const mine = B.live(B.sides[s].units);
      const theirs = B.live(B.sides[B.other(s)].units);
      if (mine.length !== 1 || theirs.length > 3) continue;
      const u = mine[0];
      if (u.hp > u.maxHp * 0.4) continue;
      const chance = Math.min(0.8, Math.max(0.05, 1 - u.hp / u.maxHp));
      if (B.rnd() > chance) continue;
      u.hp = u.maxHp;
      const dead = B.sides[s].units.find((x) => !x.alive);
      if (dead) {
        dead.alive = true;
        dead.hp = Math.floor(dead.maxHp * 0.3);
        dead.qi = 3;
        B.log.push(`${dead.name} 因背水一战复苏`);
      }
      for (const x of B.sides[s].units) {
        if (!x.alive) continue;
        x.debuffs = [];
        x.st = x.st.filter((st) => !ELEMENTAL_STATUS.includes(st.k));
        if (x !== u) x.qi = 3;
      }
      for (const x of B.sides[B.other(s)].units) x.qi = Math.max(0, x.qi - 3);
      B.backwater = { loser: s, until: B.round + 5, deadline: B.round + 7 };
      B.log.push('【背水一战！限时 7 回合绝杀！】');
      return;
    }
  };
  B.rnd_ = null;

  /* ---- 引擎内部工具（挂在 B 上，供技能使用） ---- */
  B.other = (s) => (s === 'player' ? 'enemy' : 'player');
  B.foesOf = (unit) => B.sides[B.other(unit.side)].units;
  B.alliesOf = (unit) => B.sides[unit.side].units;
  B.live = (units) => units.filter((u) => u.alive);
  B.hasStatus = (u, k) => u.st.some((s) => s.k === k);
  B.hasBuff = (u, k) => u.buffs.some((b) => b.k === k);
  B.hasDebuff = (u, k) => u.debuffs.some((d) => d.k === k);

  B.gainQi = (u, n) => { if (u.alive) u.qi = Math.max(0, u.qi + n); };

  B.addStatus = (u, k, turns) => {
    if (!u.alive) return;
    const am = B.rmods(B.other(u.side));
    // 控制条例 19.3 / 19.6：控制抗性、无敌免疫、每回合硬控次数上限、递减
    if (HARD_CC.includes(k)) {
      if (u.ccResist > 0) { B.log.push(`${u.name} 处于控制抗性，${k} 无效`); return; }
      if (u.invuln > 0) { B.log.push(`${u.name} 处于无敌，${k} 无效`); return; }
      if (u.ccDone >= 1) { B.log.push(`${u.name} 本大回合已被硬控过，${k} 不生效`); return; }
      const used = (B.ccThisRound && B.ccThisRound[u.side]) || 0;
      if (used >= 2) { B.log.push(`本方本回合硬控已达 2 次上限，${k} 不生效`); return; }
      if ((u.ccWindow || 0) >= 2) { turns = Math.max(1, turns - 1); B.log.push('连续控制递减：持续 -1 回合'); }
      u.ccDone += 1;
      u.ccWindow = (u.ccWindow || 0) + 1;
      B.ccThisRound = B.ccThisRound || {};
      B.ccThisRound[u.side] = used + 1;
      if (k === '冰冻') turns = Math.max(1, turns + (am.freezeTurnsAdd || 0));
    }
    const exist = u.st.find((s) => s.k === k);
    if (exist) { exist.t = Math.max(exist.t, turns); exist.fresh = true; return; }
    // 元素异常共存上限：默认 2 种，共鸣可放宽到 3
    const cur = u.st.filter((s) => ELEMENTAL_STATUS.includes(s.k));
    const maxN = B.rmods(u.side).maxStatus || 2;
    if (ELEMENTAL_STATUS.includes(k) && cur.length >= maxN) {
      const oldest = cur[0];
      u.st = u.st.filter((s) => s !== oldest);
      B.log.push(`${u.name} 被新的${k}覆盖了${oldest.k}`);
    }
    u.st.push({ k, t: turns, fresh: true });
    B.log.push(`${u.name} 陷入【${k}】${turns}回合`);
  };

  B.clearStatus = (u, k) => { u.st = u.st.filter((s) => s.k !== k); };

  B.buff = (u, k, turns) => {
    if (!u.alive) return;
    const e = u.buffs.find((b) => b.k === k);
    if (e) { e.t = Math.max(e.t, turns); e.fresh = true; return; }
    if (u.buffs.length >= 2) u.buffs.shift();
    u.buffs.push({ k, t: turns, fresh: true });
  };

  B.debuff = (u, k, turns) => {
    if (!u.alive) return;
    const e = u.debuffs.find((d) => d.k === k);
    if (e) { e.t = Math.max(e.t, turns); e.fresh = true; return; }
    if (u.debuffs.length >= 2) u.debuffs.shift();
    u.debuffs.push({ k, t: turns, fresh: true });
  };

  B.clearDebuffs = (u) => { u.debuffs = []; };
  B.popDebuff = (u) => { u.debuffs.shift(); };

  B.mark = (u, k, n) => { u.marks[k] = clamp((u.marks[k] || 0) + n, 0, 99); };
  B.stack = (u, k, n = 1) => { u.stacks = u.stacks || {}; u.stacks[k] = clamp((u.stacks[k] || 0) + n, 0, 99); };
  B.doubleNext = (u) => { u.doubleNext = true; };
  B.useMark = (u, k, n) => {
    if ((u.marks[k] || 0) < n) return false;
    u.marks[k] -= n;
    return true;
  };

  B.heal = (src, u, n) => {
    if (!u.alive || n <= 0) return 0;
    const bonus = src && src.marks && src.marks.辉光 ? 1 + src.marks.辉光 * 0.02 : 1;
    const amount = Math.max(1, Math.floor(n * bonus * (B.mods().heal || 1) * (B.rmods(src && src.side).healMult || 1))) + ((wdef(src) && wdef(src).mods.healAdd) || 0);
    const before = u.hp;
    u.hp = Math.min(u.maxHp, u.hp + amount);
    const real = u.hp - before;
    if (real > 0) B.log.push(`${u.name} 回复 ${real} 血`);
    return real;
  };

  B.shield = (u, n, turns) => {
    if (!u.alive) return;
    const mult = B.rmods(u.side).shieldMult || 1;
    const wm = wdef(u);
    const amount = Math.floor(n * mult * ((wm && wm.mods && wm.mods.shieldMult) || 1));
    u.shield = { n: (u.shield && u.shield.t > 0 ? u.shield.n : 0) + amount, t: turns };
    B.log.push(`${u.name} 获得 ${amount} 点护盾`);
  };

  B.reduce = (u, pct, turns) => { u.reduce = { pct, t: turns }; B.log.push(`${u.name} 减伤 ${Math.round(pct * 100)}%`); };
  B.invuln = (u, turns) => { u.invuln = Math.max(u.invuln, turns); B.log.push(`${u.name} 进入无敌`); };
  B.addWet = (u, turns) => { u.wet = Math.max(u.wet, turns); B.log.push(`${u.name} 附加潮湿`); };

  B.clearAllFire = () => {
    for (const s of [B.sides.player, B.sides.enemy]) {
      for (const u of s.units) { u.vals.火 = 0; u.st = u.st.filter((x) => x.k !== '灼烧'); }
    }
    B.log.push('全场火值与灼烧被清空');
  };

  B.selfDamage = (u, n) => {
    if (!u.alive) return;
    u.hp = Math.max(1, u.hp - n);
    B.log.push(`${u.name} 自损 ${n} 血`);
  };

  B.stackElement = (atk, def, kind, val) => {
    if (!def.alive || val <= 0) return;
    const res = RESIST[def.element] || {};
    const eff = res.applyToMe && res.applyToMe[kind] ? res.applyToMe[kind] : 1;
    const v = Math.max(1, Math.floor(val * eff));
    const m = B.mods();
    let vv = v;
    if (kind === '火') {
      if (m.fireValExtra) vv += m.fireValExtra;
      if (m.fireValMinus) vv = Math.max(1, vv - m.fireValMinus);
      if (m.fireValHalf) vv = Math.max(1, Math.floor(vv / 2));
    }
    if (kind === '冰' && m.iceValExtra) vv += m.iceValExtra;
    if (kind === '毒' && m.poisonGain) vv = Math.max(1, Math.floor(vv * m.poisonGain));
    if (kind === '光' && m.lightGain) vv = Math.ceil(vv * (1 + m.lightGain));
    if (kind === '暗' && m.darkGain) vv += m.darkGain;
    const wa = wdef(atk);
    if (wa && wa.mods) {
      if (kind === '火' && wa.mods.fireValAdd) vv += wa.mods.fireValAdd;
      if (kind === '冰' && wa.mods.iceValAdd) vv += wa.mods.iceValAdd;
    }
    const wv = wdef(def);
    if (wv && wv.mods && wv.mods.elemTakeMinus && def !== atk) vv = Math.max(1, vv - wv.mods.elemTakeMinus);
    def.vals[kind] = (def.vals[kind] || 0) + vv;
    B.log.push(`${def.name} +${v}${kind}值（${def.vals[kind]}）`);
    const ab = ABNORMAL[kind];
    if (def.vals[kind] >= ab.th) {
      def.vals[kind] = 0;
      let turns = ab.turns;
      if (kind === '火' && RESIST[def.element] && RESIST[def.element].burnTurns) turns = RESIST[def.element].burnTurns;
      B.addStatus(def, ab.name, turns);
    }
  };

  B.splash = (atk, target, dmg, ele) => {
    const foes = B.foesOf(target);
    const idx = foes.indexOf(target);
    if (idx < 0) return;
    [foes[idx - 1], foes[idx + 1]].forEach((u) => { if (u && u.alive) B.hit(atk, u, { dmg, ele }); });
  };

  B.hit = (atk, target, o = {}) => {
    if (!target || !target.alive) return 0;
    if (!atk.alive && !o.force) return 0;
    atk._seg = (atk._seg || 0) + 1;
    let part = 'body';
    if (o.part !== false) {
      const r = B.rnd() * 100;
      const v = target.parts.vital + (B.hasStatus(target, '冰冻') ? -10 : 0);
      part = r < v ? 'vital' : r < v + target.parts.body ? 'body' : 'armor';
    }
    let dmg = o.dmg;
    if (o.mult) dmg *= o.mult;
    if (atk.poisonBoost && o.ele && o.ele[0] === '毒') { dmg *= 2; atk.poisonBoost = false; B.log.push('血祭加持 ×2'); }
    if (o.part !== false) dmg *= PART_MULT[part];

    // 常驻/气韵
    dmg *= 1 + atk.spirit * 0.02;
    // 临时增益
    if (B.hasBuff(atk, '锐锋')) dmg *= 1.25;
    if (B.hasBuff(atk, '狂怒')) dmg *= 1.4;
    if (B.hasBuff(atk, '贯通') && o.aoe) dmg *= 1.3;
    if (atk.stacks && atk.stacks.愈战) dmg *= 1 + atk.stacks.愈战 * 0.04;
    if (atk.doubleNext) { dmg *= 2; atk.doubleNext = false; }
    // 敌方易伤
    if (B.hasDebuff(target, '破甲')) dmg *= 1.2;
    if (B.hasStatus(target, '雷罚')) dmg *= 1.3;
    if (B.hasStatus(target, '锈蚀')) dmg *= 1.15;
    if (B.hasStatus(atk, '诅咒')) dmg *= 0.85;
    const skEl = o.ele ? o.ele[0] : atk.element;
    const taken = (RESIST[target.element] && RESIST[target.element].dmgTaken) || {};
    if (taken[skEl]) dmg *= 1 + taken[skEl];
    if (skEl === '土' && B.hasStatus(target, '重压')) dmg *= 1.25;
    if (skEl === '光' && B.hasStatus(target, '辉耀')) dmg *= 1.25;
    if (skEl === '火' && B.mods().fireDmg) dmg *= 1 + B.mods().fireDmg;
    if (skEl === '水' && B.mods().waterDmg) dmg *= 1 + B.mods().waterDmg;
    // 元素共鸣
    const rmA = B.rmods(atk.side);
    const rmT = B.rmods(target.side);
    if (skEl === '火' && rmA.fireDmg) dmg *= 1 + rmA.fireDmg;
    if (skEl === '水' && rmA.waterDmg) dmg *= 1 + rmA.waterDmg;
    if (skEl === '土' && rmA.earthDmg) dmg *= 1 + rmA.earthDmg;
    if (skEl === '无' && rmA.wuDmg) dmg *= 1 + rmA.wuDmg;
    if (skEl === '暗' && rmA.curseDmg) dmg *= 1 + rmA.curseDmg;
    if (rmA.armorDmg) dmg *= 1 + rmA.armorDmg;
    if (rmT.dmgTakenMult) dmg *= rmT.dmgTakenMult;
    if (B.backwater && B.round <= B.backwater.until) {
      if (atk.side === B.backwater.loser) dmg *= 1.3;
      else dmg *= 0.9;
      if (target.side === B.backwater.loser) dmg *= 0.9;
      else dmg *= 1.2;
    }
    const wstage = weaponStage(atk);
    if (wstage === 'intact') dmg *= 1.1;
    else if (wstage === 'cracked') dmg *= 1.05;
    const wd = wdef(atk);
    if (wd && wd.mods) {
      if (wd.mods.dmgPct) dmg *= 1 + wd.mods.dmgPct;
      if (wd.mods.dmgPctLow && atk.hp < atk.maxHp * wd.mods.dmgPctLow.below) dmg *= 1 + wd.mods.dmgPctLow.pct;
    }
    // 削弱
    if (B.hasDebuff(atk, '挫志')) dmg *= 0.75;
    // 个人减伤
    if (target.reduce && target.reduce.t > 0) dmg *= 1 - target.reduce.pct;
    // 元素反应（蒸发/导电）：扣血前结算倍率
    if (o.ele) {
      const [kind] = o.ele;
      if (kind === '火' && target.wet > 0) { dmg *= 1.4; target.wet = 0; B.log.push('蒸发 ×1.4'); }
      else if (kind === '雷' && target.wet > 0) { dmg *= 1.2; target.wet = 0; B.log.push('导电 ×1.2'); }
    }
    // 无敌
    if (target.invuln > 0) dmg = 0;

    dmg = Math.max(0, Math.floor(dmg));

    // 护盾
    if (dmg > 0 && target.shield && target.shield.t > 0 && target.shield.n > 0) {
      const absorb = Math.min(target.shield.n, dmg);
      target.shield.n -= absorb;
      dmg -= absorb;
      if (target.shield.n <= 0) target.shield = null;
      B.log.push(`${target.name} 护盾吸收 ${absorb}`);
    }

    if (dmg > 0) {
      target.hp = Math.max(0, target.hp - dmg);
      target.hurtThisRound = true;
      target.dmgTaken = (target.dmgTaken || 0) + dmg;
      B.log.push(`${atk.name}→${target.name} ${part === 'vital' ? '要害' : part === 'armor' ? '护甲' : '身体'} ${dmg}伤${o.pure ? '(纯粹)' : ''}`);
    } else {
      B.log.push(`${atk.name}→${target.name} 未造成伤害`);
    }

    // 割裂
    if (dmg > 0 && B.hasDebuff(target, '割裂')) {
      target.hp = Math.max(0, target.hp - 6);
      B.log.push(`${target.name} 割裂 -6`);
    }

    // 元素叠加（完全未造成伤害则不叠）
    if (o.ele && dmg > 0) {
      let [kind, val] = o.ele;
      if (part === 'vital') val = Math.ceil(val * 1.5);
      if (part === 'armor') val = Math.max(0, val - 1);
      if (kind === '冰' && target.wet > 0 && target.vals.冰 >= 6) { target.wet = 0; B.addStatus(target, '冰冻', 1); }
      B.stackElement(atk, target, kind, val);
      if (rmA.randomElement) {
        const extra = ['火', '冰', '雷'][Math.floor(B.rnd() * 3)];
        B.stackElement(atk, target, extra, 1);
      }
    }

    if (target.hp <= 0) B.kill(target);
    return dmg;
  };

  B.kill = (u) => {
    if (!u.alive) return;
    u.alive = false;
    u.hp = 0;
    u.qi = 0;
    u.st = [];
    u.buffs = [];
    u.debuffs = [];
    u.shield = null;
    u.vals = { 火: 0, 冰: 0, 雷: 0, 毒: 0 };
    B.log.push(`${u.name} 阵亡`);
  };

  beginRound(B);
  if (B.mods().wetAll) {
    for (const s of [B.sides.player, B.sides.enemy]) for (const u of s.units) u.wet = Math.max(u.wet, B.mods().wetAll);
  }
  // 后手方开局额外 +2 气势（第二章，一次性补偿）
  const secondSide = B.other(B.first);
  for (const u of B.sides[secondSide].units) if (u.alive) u.qi += 2;
  B.log.push(`${B.sides[secondSide].label}（后手）开局 +2 气势`);
  return B;
}

/* ---------------- 回合流程 ---------------- */
function beginRound(B) {
  B.round += 1;
  B.x = Math.min(2, 1 + Math.floor((B.round - 1) / 4));
  B.log.push(`—— 第 ${B.round} 大回合开始（气势基数 x=${B.x}）——`);

  // 1. DOT
  for (const side of [B.sides.player, B.sides.enemy]) {
    for (const u of side.units) {
      if (!u.alive) continue;
      // 休整回耐：上一大回合没有释放技能则 +2（受不可逆损坏上限约束）
      if (!u.acted && u.weapon && u.weapon.dur > 0) {
        const half = u.weapon.max * 0.5;
        const cap = u.weapon.dur < half ? (u.weapon.dur < 4 ? 0 : 7) : u.weapon.max;
        if (cap > 0) u.weapon.dur = Math.min(cap, u.weapon.dur + 2);
      }
      u.hurtThisRound = false;
      u.dmgTaken = 0;
      u.acted = false;
      u.actsUsed = 0;
      u.zeroUsed = false;
      u.ccDone = 0;
      u.wear = 0;
      for (const s of u.st) {
        if (!s.t || s.t <= 0) continue;
        if (s.k === '灼烧') {
          const am = B.rmods(B.other(u.side));
          const dot = (RESIST[u.element] && RESIST[u.element].burnDot ? 2 : 5) + (am.burnDotAdd || 0);
          u.hp = Math.max(0, u.hp - dot);
          B.log.push(`${u.name} 灼烧 -${dot}`);
        } else if (s.k === '中毒') {
          const am = B.rmods(B.other(u.side));
          const dot = 3 + (am.poisonDotAdd || 0);
          u.hp = Math.max(0, u.hp - dot);
          B.log.push(`${u.name} 中毒 -${dot}`);
        } else if (s.k === '缠绕') {
          u.hp = Math.max(0, u.hp - 3);
          B.log.push(`${u.name} 缠绕 -3`);
        }
      }
      // 印记类回合钩子：缫丝（给随机敌方挂虫卵）／毒瘴（敌方全体 +2 毒）
      if (u.marks.缫丝 > 0) {
        const foes = B.live(B.foesOf(u));
        if (foes.length) {
          const t = foes[Math.floor(B.rnd() * foes.length)];
          B.mark(t, '虫卵', 1);
          B.log.push(`${u.name} 的缫丝给 ${t.name} 挂上虫卵`);
        }
        u.marks.缫丝 -= 1;
      }
      if (u.marks.毒瘴 > 0) {
        for (const t of B.live(B.foesOf(u))) B.stackElement(u, t, '毒', 2);
        u.marks.毒瘴 -= 1;
      }
      if (u.hp <= 0) B.kill(u);
    }
  }

  // 2. 冰冻锁定
  for (const side of [B.sides.player, B.sides.enemy]) {
    for (const u of side.units) {
      u.frozen = u.alive && (B.hasStatus(u, '冰冻') || B.hasStatus(u, '麻痹'));
    }
  }

  // 3. 发放气势
  for (const side of [B.sides.player, B.sides.enemy]) {
    for (const u of side.units) {
      if (!u.alive || u.frozen) continue;
      u.qi += B.x;
      if (B.hasStatus(u, '诅咒')) u.qi = Math.max(0, u.qi - 1);
    }
  }

  // 4. 元素共鸣回合结算
  B.ccThisRound = {};
  for (const sideKey of ['player', 'enemy']) {
    const rm = B.rmods(sideKey);
    const foeSide = B.sides[B.other(sideKey)];
    for (const u of B.sides[sideKey].units) {
      if (!u.alive) continue;
      if (u.ccWindow > 0) u.ccWindow -= 1;
      if (rm.markAuto) B.mark(u, rm.markAuto, 1);
      if (rm.healPerRound) u.hp = Math.min(u.maxHp, u.hp + rm.healPerRound);
      if (rm.qiPerRound) u.qi += rm.qiPerRound;
      if (rm.purgePerRound && u.debuffs.length) {
        const d = u.debuffs.shift();
        B.log.push(`${u.name} 共鸣驱散【${d.k}】`);
      }
    }
    if (rm.enemyQiDrain) {
      for (const t of B.live(foeSide.units)) t.qi = Math.max(0, t.qi - rm.enemyQiDrain);
    }
  }

  // 5. 环境回合结算
  const m = B.mods();
  if (B.env) B.log.push(`环境【${B.env.name}】生效`);
  for (const sideKey of ['player', 'enemy']) {
    const otherKey = B.other(sideKey);
    for (const u of B.sides[sideKey].units) {
      if (!u.alive) continue;
      if (m.dotAll) { u.hp = Math.max(0, u.hp - m.dotAll); B.log.push(`${u.name} 冻伤 -${m.dotAll}`); }
      if (m.waterSelfDot && u.element === '水') { u.hp = Math.max(0, u.hp - m.waterSelfDot); B.log.push(`${u.name} 环境灼伤 -${m.waterSelfDot}`); }
      if (m.wetThunder && u.wet > 0) B.stackElement(u, u, '雷', m.wetThunder);
      if (m.weaponWear3 && B.round % 3 === 0 && u.weapon && u.weapon.dur > 0) {
        u.weapon.dur = Math.max(0, u.weapon.dur - 1);
        B.log.push(`${u.name} 的武器被环境磨损 1 点`);
      }
      if (u.hp <= 0) B.kill(u);
    }
    if (m.poisonPerRound) {
      for (const t of B.live(B.sides[otherKey].units)) {
        if (m.poisonPerRound > 0) B.stackElement(t, t, '毒', m.poisonPerRound);
        else if ((t.vals.毒 || 0) > 0) t.vals.毒 = Math.max(0, t.vals.毒 + m.poisonPerRound);
      }
    }
  }

  B.phase = B.first;
  B.checkBackwater();
  checkWin(B);
}

function act(B, sideKey, actions) {
  if (B.over) throw new Error('对局已经结束，用 mayhem_board 看盘面');
  if (B.phase !== sideKey) throw new Error(`现在不是${sideKey === 'player' ? '你' : '我'}的行动阶段`);

  const side = B.sides[sideKey];

  // 预校验整批动作：全部合法才开始执行，避免半途报错留下残局
  const preview = new Map();
  for (const a of actions || []) {
    const u = side.units.find((x) => x.alive && (x.name === a.unit || x.key === a.unit));
    if (!u) throw new Error(`没有可行动的角色：${a.unit}`);
    if (u.frozen) throw new Error(`${u.name} 被冰冻/麻痹，无法行动`);
    const st = preview.get(u) || { acts: 0, zero: false, qi: u.qi };
    if (st.acts >= 2) throw new Error(`${u.name} 本回合的 2 次操作已经用完`);
    if (B.round === 1 && sideKey === B.first && st.acts >= 1) throw new Error('第 1 大回合先手方每名角色只能操作 1 次');
    const sk = CHARS[u.name].skills.find((s) => (s.name === a.skill || s.id === Number(a.skill)) && (s.form || '常态') === (u.form || '常态'));
    if (!sk) {
      const known = CHARS[u.name].skills.some((s) => s.name === a.skill || s.id === Number(a.skill));
      throw new Error(known ? `${u.name} 的【${a.skill}】在当前形态下不可用` : `${u.name} 没有技能：${a.skill}`);
    }
    let c = sk.name === '冲山' && u.freeChongshan ? 0 : sk.cost;
    if (c >= 5 && u.element === '雷' && B.mods().thunderUlt) c = Math.max(0, c - B.mods().thunderUlt);
    if (c >= 5 && B.hasDebuff(u, '封印')) throw new Error(`${u.name} 被封印，无法释放 ${c} 费技能`);
    if (B.round === 1 && sideKey === B.first && c >= 7) throw new Error(`第 1 大回合先手方不能用 ${c} 费技能`);
    if (c > st.qi) throw new Error(`${u.name} 气势不足：${sk.name} 需 ${c}，现有 ${st.qi}`);
    if (c === 0 && (st.zero || u.zeroUsed)) throw new Error(`${u.name} 本回合的 0 费技能已经用过了`);
    st.qi -= c;
    st.acts += 1;
    if (c === 0) st.zero = true;
    preview.set(u, st);
  }

  for (const a of actions || []) {
    const u = side.units.find((x) => x.alive && (x.name === a.unit || x.key === a.unit));
    if (!u) throw new Error(`没有可行动的角色：${a.unit}`);
    if (u.frozen) throw new Error(`${u.name} 被冰冻/麻痹，无法行动`);
    if (u.actsUsed >= 2) throw new Error(`${u.name} 本回合的 2 次操作已经用完`);
    if (B.round === 1 && sideKey === B.first && u.actsUsed >= 1) throw new Error('第 1 大回合先手方每名角色只能操作 1 次');

    const skill = u.name && CHARS[u.name].skills.find((s) => (s.name === a.skill || s.id === Number(a.skill)) && (s.form || '常态') === (u.form || '常态'));
    if (!skill) throw new Error(`${u.name} 没有技能或该技能在当前形态下不可用：${a.skill}`);

    let cost = skill.name === '冲山' && u.freeChongshan ? 0 : skill.cost;
    if (cost >= 5 && u.element === '雷' && B.mods().thunderUlt) cost = Math.max(0, cost - B.mods().thunderUlt);
    if (cost >= 5 && B.hasDebuff(u, '封印')) throw new Error(`${u.name} 被封印，无法释放 ${cost} 费技能`);
    // 先手限制（第一章）：第 1 大回合先手方不能用 ≥7 费技能
    if (B.round === 1 && sideKey === B.first && cost >= 7) {
      throw new Error(`第 1 大回合先手方不能用 ${cost} 费技能`);
    }
    if (cost > u.qi) throw new Error(`${u.name} 气势不足：${skill.name} 需 ${cost}，现有 ${u.qi}`);
    if (cost === 0 && u.zeroUsed) throw new Error(`${u.name} 本回合的 0 费技能已经用过了`);
    if (cost === 0) u.zeroUsed = true;
    u.qi -= cost;
    if (skill.name === '冲山') u.freeChongshan = false;

    const foes = B.foesOf(u);
    const mates = B.alliesOf(u);
    const pos = (n) => {
      const arr = skill.target === 'ally1' || skill.target === 'allies' ? mates : foes;
      const t = arr[Number(n) - 1];
      if (t && t.alive) return t;
      const first = arr.find((x) => x.alive);
      if (first) { B.log.push(`目标位置 ${n} 已阵亡，改打 ${first.name}`); return first; }
      throw new Error(`目标位置 ${n} 不可用`);
    };

    let targets = [];
    const want = (a.targets || []).map((n) => pos(n));
    if (skill.target === 'one') { if (!want.length) throw new Error(`${skill.name} 需要 1 个目标`); targets = [want[0]]; }
    else if (skill.target === 'two') { if (want.length < 1) throw new Error(`${skill.name} 需要 1-2 个目标`); targets = want.slice(0, 2); }
    else if (skill.target === 'all') targets = B.live(foes);
    else if (skill.target === 'allies') targets = B.live(mates);
    else if (skill.target === 'ally1') { if (!want.length) throw new Error(`${skill.name} 需要 1 个己方目标`); targets = [want[0]]; }
    else if (skill.target === 'self') targets = [u];

    const spent = new Map(foes.map((f) => [f, f.dmgTaken]));
    const aliveBefore = foes.filter((f) => f.alive).length;
    B.log.push(`${u.name} 使用【${skill.name}】(耗${cost})`);
    u._seg = 0;
    skill.use(B, u, targets);
    u.acted = true;
    u.actsUsed += 1;
    u.wear = (cost >= 5 ? 1 : 0) + (u._seg >= 3 ? 1 : 0);

    // 气韵：命中敌方 +1；被击 -1
    if (['one', 'two', 'all'].includes(skill.target)) u.spirit = clamp(u.spirit + 1, u.spiritMin, u.spiritMax);
    for (const f of foes) if (f.alive && f.dmgTaken > (spent.get(f) || 0)) f.spirit = clamp(f.spirit - 1, f.spiritMin, f.spiritMax);

    // 击杀额外 +1 气势
    const killed = aliveBefore - foes.filter((f) => f.alive).length;
    if (killed > 0) u.qi += killed;

    checkWin(B);
    if (B.over) break;
  }

  if (B.over) return B;

  const other = B.other(sideKey);
  if (sideKey === B.first) {
    B.phase = other;
  } else {
    endRound(B);
    if (!B.over) beginRound(B);
  }
  return B;
}

function endRound(B) {
  for (const side of [B.sides.player, B.sides.enemy]) {
    for (const u of side.units) {
      if (!u.alive) continue;
      // 持续时间 -1
      if (u.ccResist > 0) u.ccResist -= 1;
      const ccBefore = u.st.filter((s) => HARD_CC.includes(s.k)).map((s) => s.k);
      u.st = u.st.filter((s) => { if (s.fresh) { s.fresh = false; return true; } s.t -= 1; return s.t > 0; });
      for (const k of ccBefore) {
        if (!u.st.some((s) => s.k === k)) {
          u.ccResist = 1;
          B.log.push(`${k}结束，${u.name} 获得控制抗性 1 回合`);
        }
      }
      u.buffs = u.buffs.filter((b) => { if (b.fresh) { b.fresh = false; return true; } b.t -= 1; return b.t > 0; });
      u.debuffs = u.debuffs.filter((d) => { if (d.fresh) { d.fresh = false; return true; } d.t -= 1; return d.t > 0; });
      // 多形态结算：炎龙神备（血量≤1/3回合末自动进入）；黯雷雷阵（3回合到期退回常态）
      if (u.name === '炎龙' && u.form === '常态' && u.hp > 0 && u.hp <= Math.floor(u.maxHp / 3)) {
        u.form = '神备';
        B.log.push('炎龙 血量降至 1/3，进入【神备】形态');
      }
      if (u.form === '雷阵' && !B.hasBuff(u, '雷阵')) {
        u.form = '常态';
        B.log.push('黯雷 退出【雷阵】形态');
      }
      if (u.invuln > 0) u.invuln -= 1;
      if (u.reduce) { u.reduce.t -= 1; if (u.reduce.t <= 0) u.reduce = null; }
      if (u.shield) { u.shield.t -= 1; if (u.shield.t <= 0) u.shield = null; }
      if (u.wet > 0) u.wet -= 1;

      // 自动回血：存活、未冰冻、血量 <65%，回 8% 最大生命
      if (!u.frozen && u.hp > 0 && u.hp < u.maxHp * 0.65) {
        const heal = Math.floor(u.maxHp * 0.08);
        u.hp = Math.min(u.maxHp, u.hp + heal);
      }
      // 武器耐久损耗
      if (u.weapon && u.weapon.dur > 0 && u.wear) {
        const mult = B.rmods(u.side).weaponWearMult || 1;
        u.weapon.dur = Math.max(0, u.weapon.dur - Math.max(1, Math.floor(u.wear * mult)));
        if (u.weapon.dur <= 0) B.log.push(`${u.name} 的武器破碎`);
      }
    }
  }
  // 破碎亡语：敌方全体固定伤害
  for (const side of [B.sides.player, B.sides.enemy]) {
    for (const u of side.units) {
      if (!u.alive || !u.weapon || u.weapon.broken || u.weapon.dur > 0) continue;
      u.weapon.broken = true;
      const wd = wdef(u);
      B.log.push(`${u.name} 的${u.weapon.name}破碎，亡语爆发`);
      if (wd && wd.wake) {
        try { wd.wake(B, u); } catch (err) { B.log.push(`亡语结算异常：${err.message}`); }
      } else {
        for (const f of B.foesOf(u)) if (f.alive) B.hit(u, f, { dmg: WEAPON_WAKE_DMG, part: false, force: true });
      }
    }
  }
  checkWin(B, true);
}

function checkWin(B, atRoundEnd = false) {
  if (B.over) return B.over;
  const p = B.live(B.sides.player.units).length;
  const e = B.live(B.sides.enemy.units).length;
  if (p === 0 && e === 0) { B.over = { winner: 'draw', reason: '双方最后存活角色同时倒下，平局' }; return B.over; }
  if (e === 0) { B.over = { winner: 'player', reason: '敌方 4 人全部阵亡' }; return B.over; }
  if (p === 0) { B.over = { winner: 'enemy', reason: '我方 4 人全部阵亡' }; return B.over; }
  if (atRoundEnd && p - e >= 3) { B.over = { winner: 'player', reason: `人数差：你 ${p} 人 vs 我 ${e} 人` }; return B.over; }
  if (atRoundEnd && e - p >= 3) { B.over = { winner: 'enemy', reason: `人数差：我 ${e} 人 vs 你 ${p} 人` }; return B.over; }
  return null;
}

/* ---------------- 展示 ---------------- */
const statusText = (u) => {
  const bits = [];
  for (const s of u.st) bits.push(`${s.k}${s.t}`);
  for (const b of u.buffs) bits.push(`${b.k}${b.t}`);
  for (const d of u.debuffs) bits.push(`${d.k}${d.t}`);
  if (u.shield && u.shield.t > 0) bits.push(`盾${u.shield.n}`);
  if (u.weapon && u.weapon.dur < u.weapon.max) bits.push(`器${u.weapon.dur}`);
  if (u.invuln > 0) bits.push('无敌');
  if (u.wet > 0) bits.push(`潮湿${u.wet}`);
  const vals = Object.entries(u.vals).filter(([, v]) => v > 0).map(([k, v]) => `${k}${v}`);
  if (vals.length) bits.push(`[${vals.join(' ')}]`);
  return bits.length ? bits.join(' ') : '—';
};

function render(B, viewer = 'player') {
  const lines = [];
  const who = B.over ? '对局结束' : B.phase === 'player' ? '你的行动阶段' : '我的行动阶段';
  lines.push(`第${B.round}大回合 · ${who} · 先手=${B.first === 'player' ? '你' : '我'} · x=${B.x} · 环境=${B.env ? B.env.name : '无'}`);
  if (B.reso) lines.push(`共鸣：你【${B.reso.player || '无'}】/ 我【${B.reso.enemy || '无'}】`);
  for (const key of ['player', 'enemy']) {
    const side = B.sides[key];
    lines.push(`【${side.label}】`);
    side.units.forEach((u, i) => {
      if (!u.alive) { lines.push(` ${i + 1} ${u.name} 已阵亡`); return; }
      const st = statusText(u);
      lines.push(` ${i + 1} ${u.name}(${u.element}) ${u.hp}/${u.maxHp} 气${u.qi} 韵${u.spirit > 0 ? '+' : ''}${u.spirit} ${st}`);
    });
    if (key === 'player') {
      const ready = side.units.filter((u) => u.alive && u.actsUsed < 2 && !u.frozen);
      for (const u of ready) {
        lines.push(`  ${u.name}：${CHARS[u.name].skills.map((s) => `${s.id}${s.name}${s.cost}`).join(' ')}`);
      }
    }
  }
  if (B.over) lines.push(`结果：${B.over.winner === 'player' ? '你赢' : B.over.winner === 'enemy' ? '我赢' : '平局'} —— ${B.over.reason}`);
  return lines.join('\n');
}

function recentLog(B, n = 12) {
  return B.log.slice(-n).join('\n');
}

/** 给 Web 界面用的纯 JSON 快照（不含函数、不含引擎内部字段） */
function snapshot(B) {
  const unit = (u) => ({
    key: u.key,
    name: u.name,
    element: u.element,
    role: u.role,
    hp: u.hp,
    maxHp: u.maxHp,
    qi: u.qi,
    spirit: u.spirit,
    alive: u.alive,
    frozen: u.frozen,
    statuses: u.st.map((s) => ({ k: s.k, t: s.t })),
    buffs: u.buffs.map((b) => ({ k: b.k, t: b.t })),
    debuffs: u.debuffs.map((d) => ({ k: d.k, t: d.t })),
    shield: u.shield && u.shield.t > 0 ? u.shield.n : 0,
    wet: u.wet,
    vals: u.vals,
    marks: u.marks,
    weapon: { name: u.weapon.name, dur: u.weapon.dur, max: u.weapon.max, broken: !!u.weapon.broken },
  });
  return {
    round: B.round,
    phase: B.phase,
    first: B.first,
    x: B.x,
    env: B.env ? { id: B.env.id, name: B.env.name } : null,
    reso: B.reso,
    resoCandidates: B.resoCandidates,
    over: B.over,
    log: B.log.slice(-16),
    sides: {
      player: {
        label: '你',
        units: B.sides.player.units.map((u) => ({
          ...unit(u),
          skills: CHARS[u.name].skills.map((s) => ({ name: s.name, cost: s.cost, target: s.target, desc: s.desc || '' })),
        })),
      },
      enemy: { label: '我', units: B.sides.enemy.units.map(unit) },
    },
  };
}

/* ---------------- 自检 ---------------- */
function selfTest() {
  const issues = [];
  const stalls = [];
  const rnd = makeRng(12345);
  const teams = roster();
  for (let game = 0; game < 30; game++) {
    const shuffled = teams.slice().sort(() => rnd() - 0.5);
    let B;
    try {
      B = createBattle({ playerTeam: shuffled.slice(0, 4), enemyTeam: shuffled.slice(4, 8), seed: 1000 + game });
    } catch (e) { issues.push(`create: ${e.message}`); continue; }
    let guard = 0;
    while (!B.over && guard++ < 200) {
      const side = B.phase;
      const units = B.sides[side].units.filter((u) => u.alive && !u.frozen && !u.acted);
      const actions = [];
      for (const u of units) {
        const def = CHARS[u.name];
        const usable = def.skills.filter((s) => (s.form || '常态') === (u.form || '常态') && s.cost <= u.qi && !(s.cost === 0 && u.zeroUsed) && !(s.cost >= 5 && B.hasDebuff(u, '封印')));
        if (!usable.length) continue;
        const s = usable[Math.floor(rnd() * usable.length)];
        const foes = B.live(B.foesOf(u));
        const mates = B.live(B.alliesOf(u));
        const posOf = (arr) => arr.map((x, i) => (x.alive ? i + 1 : 0)).filter(Boolean);
        const fp = posOf(B.foesOf(u));
        const mp = posOf(B.alliesOf(u));
        const pick = (arr) => (arr.length ? arr[Math.floor(rnd() * arr.length)] : 0);
        const a = { unit: u.name, skill: s.name };
        if ((s.target === 'one' || s.target === 'two') && !fp.length) continue;
        if (s.target === 'ally1' && !mp.length) continue;
        if (s.target === 'one') a.targets = [pick(fp)];
        if (s.target === 'two') a.targets = [pick(fp), pick(fp)];
        if (s.target === 'ally1') a.targets = [pick(mp)];
        actions.push(a);
      }
      try { act(B, side, actions); } catch (e) { issues.push(`r${B.round} ${side}: ${e.message}`); break; }
      for (const sideKey of ['player', 'enemy']) {
        for (const u of B.sides[sideKey].units) {
          if (u.hp < 0) issues.push(`${u.name} 血量为负 ${u.hp}`);
          if (u.qi < 0) issues.push(`${u.name} 气势为负 ${u.qi}`);
          if (u.alive && u.hp > u.maxHp) issues.push(`${u.name} 血量超上限`);
          if (!u.alive && u.hp !== 0) issues.push(`${u.name} 阵亡但血量 ${u.hp}`);
        }
      }
    }
    if (!B.over) { stalls.push(`game ${game}：打到 ${B.round} 回合仍未分胜负`); continue; }
    else if (!['player', 'enemy', 'draw'].includes(B.over.winner)) issues.push(`game ${game} 结果异常`);
    if (!Number.isFinite(B.round) || B.round > 100) issues.push(`game ${game} 回合数异常 ${B.round}`);
  }
  return { ok: issues.length === 0, issues: issues.slice(0, 12), stalls: stalls.slice(0, 5), games: 30, version: ENGINE_VERSION };
}

    wake(B, o) { allFoes(B, o).forEach((t) => B.hit(o, t, { dmg: 6, part: false, force: true })); allies(B, o).forEach((t) => B.mark(t, '生息印', 2)); } },

  // 十二、无属性
  { name: '撼地重锤', element: '无', dur: 12, mods: {}, passive: '被2名不同敌方攻击后额外+1气势（每回合限1次）',
    wake(B, o) { allFoes(B, o).forEach((t) => B.hit(o, t, { dmg: 5, part: false, force: true })); B.gainQi(o, 2); } },
  { name: '不坏重盾', element: '无', dur: 16, mods: { shieldMult: 1.1 }, passive: '复活后护盾效果+10%',
    wake(B, o) { allies(B, o).forEach((t) => B.shield(t, 8, 2)); B.popDebuff(o); } },
  { name: '殷红巨刃', element: '无', dur: 10, mods: { dmgPctLow: { below: 0.35, pct: 0.05 } }, passive: '击杀目标后自身回复3点血量',
    wake(B, o) { allFoes(B, o).forEach((t) => B.hit(o, t, { dmg: 6, part: false, force: true })); const m = main(B, o); if (m) B.debuff(m, '破甲', 1); } },
  { name: '沉岳重戟', element: '无', dur: 14, mods: { hpPerMark: 1 }, passive: '印记≥8层时普攻附带锐锋',
    wake(B, o) { allFoes(B, o).forEach((t) => B.hit(o, t, { dmg: 6, part: false, force: true })); B.mark(o, '沉岳', 3); } },
]);

/* ============ 元素混战 · 双人对战 UI（本地同屏热座） ============
   依赖已内联的引擎：CHARS / roster / createBattle / act / recentLog / ENVIRONMENTS */

const ELEM_COLOR = { 火:'#e0533d', 水:'#3d7de0', 风:'#3fae7a', 冰:'#4fc3dd', 雷:'#c58bff',
  毒:'#8fbb3f', 土:'#b98a4a', 光:'#e0c04a', 暗:'#8a6bd6', 金:'#b9c0cc', 木:'#4fa35a', 无:'#9aa0a6' };
const ELEM_ORDER = ['火','水','风','冰','雷','毒','土','光','暗','金','木','无'];
const FORM_NAME = { 神备: '神备', 风: '风形态', 雪域: '雪域', 云来: '云来', 雷阵: '雷阵' };
const FORM_ORDER = ['常态', '风', '雪域', '云来', '雷阵', '神备'];

const S = {
  screen: 'setup',
  p1: { name: '玩家1', team: [] },
  p2: { name: '玩家2', team: [] },
  env: 'random',
  detail: null,
  B: null,
  queue: [],
  pending: null,
  revealed: false,
  error: '',
};

const $app = () => document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function groupedRoster() {
  const g = {};
  for (const n of roster()) { const e = CHARS[n].element; (g[e] = g[e] || []).push(n); }
  return ELEM_ORDER.map((e) => ({ e, list: g[e] || [] }));
}

function charCard(name, selected) {
  const c = CHARS[name];
  return `<div class="charcard ${selected ? 'sel' : ''}" data-char="${esc(name)}">
    <div class="cn"><span class="dot" style="background:${ELEM_COLOR[c.element]}"></span>${esc(name)}</div>
    <div class="cmeta">${c.element} · ${c.maxHp} · ${c.role}</div>
  </div>`;
}

/* ---- 详情面板（按形态分组） ---- */
function skillListHTML(skills) {
  return skills.map((s) => `<div class="sk"><b>${esc(s.name)}</b><span class="cost">${s.cost}气</span><div class="skd">${esc(s.desc || '')}</div></div>`).join('');
}

function detailHTML() {
  if (!S.detail || !CHARS[S.detail]) return `<div class="detail"><div class="dmeta">把鼠标移到角色上，这里会显示完整技能详情</div></div>`;
  const c = CHARS[S.detail];
  const groups = {};
  for (const s of c.skills) { const f = s.form || '常态'; (groups[f] = groups[f] || []).push(s); }
  const body = FORM_ORDER.filter((f) => groups[f] && groups[f].length).map((f) => {
    const label = f === '常态' ? '常态技能' : `${FORM_NAME[f] || f}技能（变形后可用）`;
    return `<div class="form-title">${esc(label)}</div>${skillListHTML(groups[f])}`;
  }).join('');
  return `<div class="detail">
    <h3>${esc(c.name)} <span style="color:${ELEM_COLOR[c.element]}">${c.element}</span> <span class="tag">${esc(c.role)}</span></h3>
    <div class="dmeta">血量 ${c.maxHp} · 要害${c.parts.vital}% / 身体${c.parts.body}% / 护甲${c.parts.armor}% · 气韵 初始${c.sp.init} 上限${c.sp.max} 下限${c.sp.min}</div>
    <div class="dpas">被动：${esc(c.passive || '—')}</div>
    <div class="dsk">${body}</div>
  </div>`;
}

function updateDetail() {
  const box = document.getElementById('detailbox');
  if (box) box.innerHTML = detailHTML();
}

function pickColumn(side) {
  const p = S[side];
  const full = p.team.length === 4;
  const sel = new Set(p.team);
  const groups = groupedRoster().map((g) => `<div class="group-title"><b style="color:${ELEM_COLOR[g.e]}">${g.e}</b>系</div>
    <div class="rostergrid">${g.list.map((n) => charCard(n, sel.has(n))).join('')}</div>`).join('');
  return `<div class="col card" data-side="${side}">
    <h2>${esc(p.name)} <span class="tag">${side === 'p1' ? '红色方' : '蓝色方'}</span></h2>
    <input class="name" data-name="${side}" value="${esc(p.name)}" placeholder="输入玩家名">
    ${groups}
    <div class="counter ${full ? 'ok' : ''}">已选 ${p.team.length} / 4${full ? ' ✓' : ''}</div>
  </div>`;
}

function renderSetup() {
  const canStart = S.p1.team.length === 4 && S.p2.team.length === 4;
  const dup = [...S.p1.team].filter((n) => S.p2.team.includes(n));
  const envBtns = [['random', '随机'], ...ENVIRONMENTS.map((e) => [e.id, e.name])]
    .map(([id, name]) => `<button class="envbtn ${S.env === id ? 'sel' : ''}" data-env="${id}">${name}</button>`).join('');
  $app().innerHTML = `
    <h1>元素混战 · 双人对战</h1>
    <div class="sub">本地同屏热座 · 双方各选 4 名角色 · 轮流行动 · 全灭或回合末人数差 ≥3 判胜</div>
    <div class="row">${pickColumn('p1')}${pickColumn('p2')}</div>
    <div class="card" style="margin-top:12px">
      <b style="font-size:13px">战场环境</b>
      <div class="envrow">${envBtns}</div>
    </div>
    <div id="detailbox" class="detail"></div>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
      <button class="btn big" data-go="start" ${canStart && !dup.length ? '' : 'disabled'}>开始对战</button>
      ${dup.length ? `<span class="err">角色重复：${dup.join('、')}（两边不能选同一角色）</span>` : ''}
    </div>`;
  updateDetail();
}

/* ---------------- 战斗 ---------------- */

const sideOf = (key) => (key === 'player' ? 'p1' : 'p2');

function chipsText(u) {
  const bits = [];
  for (const s of u.st) bits.push(`${s.k}${s.t}`);
  for (const b of u.buffs) bits.push(b.k + b.t);
  for (const d of u.debuffs) bits.push(d.k + d.t);
  if (u.shield && u.shield.t > 0) bits.push(`盾${u.shield.n}`);
  if (u.invuln > 0) bits.push('无敌');
  if (u.wet > 0) bits.push(`潮湿${u.wet}`);
  const vals = Object.entries(u.vals || {}).filter(([, v]) => v > 0).map(([k, v]) => `${k}${v}`);
  if (vals.length) bits.push(`[${vals.join(' ')}]`);
  return bits.length ? bits.join(' ') : '—';
}

function unitHTML(u, idx, sideKey) {
  const dead = !u.alive;
  const pct = Math.max(0, Math.min(100, (u.hp / u.maxHp) * 100));
  const color = pct > 60 ? '#43b581' : pct > 30 ? '#e0a83d' : '#e0533d';
  const pickable = S.pending && S.pending.side === sideKey && u.alive;
  const picked = S.pending && S.pending.picked.includes(idx + 1);
  const form = u.form && u.form !== '常态' ? `<span class="form-badge">${esc(FORM_NAME[u.form] || u.form)}</span>` : '';
  return `<div class="unit ${dead ? 'dead' : ''} ${pickable ? 'pickable' : ''} ${picked ? 'picked' : ''}" data-utgt="${sideKey}:${idx}">
    <div class="nm"><span class="dot" style="background:${ELEM_COLOR[u.element]}"></span>${esc(u.name)}${form}
      <span class="hp">${dead ? '阵亡' : `${u.hp}/${u.maxHp}`}</span></div>
    ${dead ? '' : `<div class="hpbar"><i style="width:${pct}%;background:${color}"></i></div>`}
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="chips">${chipsText(u)}</span>
      <span class="qi">气${u.qi} ${u.spirit > 0 ? '+' : ''}${u.spirit}</span>
    </div>
  </div>`;
}

function sideHTML(units, sideKey, label, accent) {
  return `<div class="side-label" style="color:${accent}">■ ${label} ${esc(S[sideOf(sideKey)].name)}</div>
    <div class="units">${units.map((u, i) => unitHTML(u, i, sideKey)).join('')}</div>`;
}

function queuedZero(name) {
  return S.queue.some((q) => q.unit === name && CHARS[name].skills.find((s) => s.name === q.skill).cost === 0);
}

function skillButtons(sideKey) {
  const units = S.B.sides[sideKey].units;
  const firstLimited = S.B.round === 1 && sideKey === S.B.first;
  const usedBy = (name) => S.queue.filter((q) => q.unit === name).length;
  return units.map((u) => {
    if (!u.alive) return '';
    const def = CHARS[u.name];
    const form = u.form || '常态';
    const skills = def.skills.filter((s) => (s.form || '常态') === form);
    const btns = skills.map((s) => {
      const used = usedBy(u.name);
      const cost = s.name === '冲山' && u.freeChongshan ? 0 : s.cost;
      const disabled = used >= 2
        || (firstLimited && used >= 1)
        || cost > u.qi
        || (cost === 0 && (u.zeroUsed || queuedZero(u.name)))
        || (cost >= 5 && S.B.hasDebuff(u, '封印'))
        || (firstLimited && cost >= 7)
        || u.frozen;
      return `<button class="skbtn" data-skill="${sideKey}|${u.key}|${esc(s.name)}" ${disabled ? 'disabled' : ''}
        title="${esc(s.desc || '')}">${esc(s.name)}<span class="cost">${cost}</span></button>`;
    }).join('');
    const frozen = u.frozen ? ' <span style="color:#4fc3dd">冰冻</span>' : '';
    const formTag = form !== '常态' ? ` <span class="form-badge">${esc(FORM_NAME[form] || form)}</span>` : '';
    return `<div class="unit-row"><span class="uname">${esc(u.name)}${frozen}${formTag}</span><div style="flex:1">${btns}</div></div>`;
  }).join('');
}

function needHandoff() { return !S.revealed && !S.B.over; }
function handoffOverlay(name, accent) {
  return `<div class="overlay"><div class="box">
    <h2 style="color:${accent}">轮到 ${esc(name)}</h2>
    <p>请把设备交给 <b>${esc(name)}</b>，点下方按钮开始编排本回合行动。</p>
    <button class="btn big" data-go="reveal">开始回合</button>
  </div></div>`;
}
function overOverlay(B) {
  const winner = B.over.winner === 'player' ? S.p1.name : B.over.winner === 'enemy' ? S.p2.name : '平局';
  return `<div class="overlay"><div class="box">
    <h2>${B.over.winner === 'draw' ? '平局' : esc(winner) + ' 获胜'}</h2>
    <p>${esc(B.over.reason)}</p>
    <button class="btn big" data-go="rematch">再来一局</button>
    <button class="btn ghost" data-go="tomenu">返回选人</button>
  </div></div>`;
}

function renderBattle() {
  const B = S.B;
  const sideKey = B.phase;
  const otherKey = B.other(sideKey);
  const accent = sideKey === 'player' ? '#e0533d' : '#3d7de0';
  const activeName = S[sideOf(sideKey)].name;

  const foe = sideHTML(B.sides[otherKey].units, otherKey, '对手', sideOf(otherKey) === 'p1' ? '#e0533d' : '#3d7de0');
  const mine = sideHTML(B.sides[sideKey].units, sideKey, '行动方', accent);

  const queueHTML = S.queue.map((q) => `<span class="qitem">${esc(q.unit)}·${esc(q.skill)}${q.targets.length ? '@' + q.targets.join(',') : ''}</span>`).join('');

  let pickHint = '';
  if (S.pending) {
    const need = S.pending.skill.target === 'two' ? '1-2' : '1';
    const commitBtn = S.pending.skill.target === 'two'
      ? `<button class="btn" data-go="commit" ${S.pending.picked.length >= 1 ? '' : 'disabled'}>确定目标</button>` : '';
    pickHint = `<div class="pick-hint">${esc(S.pending.unit)} 使用【${esc(S.pending.skill.name)}】：点选目标（已选 ${S.pending.picked.length}/${need}） ${commitBtn}</div>`;
  }

  const resoLine = `共鸣 ${esc(S[sideOf('player')].name)}【${B.reso.player || '无'}】 / ${esc(S[sideOf('enemy')].name)}【${B.reso.enemy || '无'}】`;

  $app().innerHTML = `
    <h1 style="font-size:16px">元素混战 · 双人对战</h1>
    <div class="battle-top">
      <span class="phase" style="color:${accent}">${esc(activeName)} 行动</span>
      <span>第 ${B.round} 大回合</span>
      <span>环境 ${esc(B.env.name)}</span>
      <span>x=${B.x}</span>
      <span style="color:var(--muted)">${esc(resoLine)}</span>
      ${B.backwater ? `<span style="color:#e0533d">背水一战</span>` : ''}
    </div>
    <div class="battle-wrap">
      <div class="battle-main">
        ${foe}
        ${mine}
        <div class="skillpanel">${pickHint}${skillButtons(sideKey)}</div>
        <div class="queuebar">
          <span style="color:var(--muted);font-size:12px">已排操作：</span>
          <span style="flex:1;display:flex;gap:6px;flex-wrap:wrap">${queueHTML || '<span style="color:var(--muted);font-size:12px">（空）</span>'}</span>
          <button class="btn" data-go="submit" ${S.queue.length ? '' : 'disabled'}>提交（${S.queue.length}）</button>
          <button class="btn ghost" data-go="clear" ${S.queue.length || S.pending ? '' : 'disabled'}>清空</button>
        </div>
        ${S.error ? `<div class="err">${esc(S.error)}</div>` : ''}
      </div>
      <aside class="battle-log"><b>战报</b>\n${esc(recentLog(B, 40))}</aside>
    </div>
    ${needHandoff() ? handoffOverlay(activeName, accent) : ''}
    ${B.over ? overOverlay(B) : ''}
  `;
}

/* ---------------- 动作 ---------------- */

function startBattle() {
  S.B = createBattle({
    playerTeam: S.p1.team, enemyTeam: S.p2.team,
    seed: Date.now() >>> 0,
    env: S.env === 'random' ? undefined : S.env,
  });
  S.queue = []; S.pending = null; S.error = ''; S.revealed = false;
  S.screen = 'battle';
}

function doSubmit() {
  const B = S.B;
  if (!S.queue.length) return;
  S.error = '';
  try {
    act(B, B.phase, S.queue.map((a) => ({ unit: a.unit, skill: a.skill, targets: a.targets })));
    S.queue = []; S.pending = null; S.revealed = false;
  } catch (e) { S.error = e.message; }
}

function startSkill(sideKey, u, skill) {
  if (skill.target === 'one' || skill.target === 'two') {
    S.pending = { unit: u.name, skill, side: S.B.other(sideKey), picked: [] };
  } else if (skill.target === 'ally1') {
    S.pending = { unit: u.name, skill, side: sideKey, picked: [] };
  } else {
    S.queue.push({ unit: u.name, skill: skill.name, targets: [] });
    S.pending = null;
  }
}

function commitPending() {
  S.queue.push({ unit: S.pending.unit, skill: S.pending.skill.name, targets: S.pending.picked });
  S.pending = null;
}

function onAppClick(ev) {
  const t = ev.target;
  const go = t.closest('[data-go]');
  if (go) {
    const g = go.dataset.go;
    if (g === 'reveal') { S.revealed = true; }
    else if (g === 'submit') { doSubmit(); }
    else if (g === 'clear') { S.queue = []; S.pending = null; }
    else if (g === 'commit') { commitPending(); }
    else if (g === 'start') { startBattle(); renderBattle(); return; }
    else if (g === 'rematch') { startBattle(); renderBattle(); return; }
    else if (g === 'tomenu') { S.screen = 'setup'; S.B = null; S.queue = []; S.pending = null; renderSetup(); return; }
    renderBattle();
    return;
  }

  if (S.screen === 'setup') {
    const nameInput = t.closest('.name');
    if (nameInput) { const side = nameInput.dataset.name; S[side].name = nameInput.value.trim() || (side === 'p1' ? '玩家1' : '玩家2'); return; }
    const col = t.closest('.col');
    const card = t.closest('[data-char]');
    if (card && col) {
      const side = col.dataset.side, n = card.dataset.char;
      S.detail = n;
      const arr = S[side].team, i = arr.indexOf(n);
      if (i >= 0) arr.splice(i, 1); else if (arr.length < 4) arr.push(n);
      renderSetup();
      return;
    }
    const envBtn = t.closest('[data-env]');
    if (envBtn) { S.env = envBtn.dataset.env; renderSetup(); return; }
    return;
  }

  // 战斗：目标点选
  const tg = t.closest('[data-utgt]');
  if (tg && S.pending) {
    const [sk, idxStr] = tg.dataset.utgt.split(':');
    if (sk !== S.pending.side) return;
    const pos = Number(idxStr) + 1;
    const picked = [...S.pending.picked];
    const k = picked.indexOf(pos);
    if (k >= 0) picked.splice(k, 1);
    else if (S.pending.skill.target === 'two' ? picked.length < 2 : picked.length < 1) picked.push(pos);
    S.pending = { ...S.pending, picked };
    if (S.pending.skill.target !== 'two' && picked.length >= 1) commitPending();
    renderBattle();
    return;
  }
  // 战斗：技能点选
  const skb = t.closest('[data-skill]');
  if (skb && !skb.disabled) {
    const [sideKey, key, skillName] = skb.dataset.skill.split('|');
    const u = S.B.sides[sideKey].units.find((x) => x.key === key);
    const skill = CHARS[u.name].skills.find((s) => s.name === skillName);
    if (skill) { startSkill(sideKey, u, skill); renderBattle(); }
  }
}

document.getElementById('app').addEventListener('click', onAppClick);
document.getElementById('app').addEventListener('mouseover', (ev) => {
  const card = ev.target.closest ? ev.target.closest('[data-char]') : null;
  if (card && card.dataset.char !== S.detail) { S.detail = card.dataset.char; updateDetail(); }
});
renderSetup();

</script>
</body>
</html>
